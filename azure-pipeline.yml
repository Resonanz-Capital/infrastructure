# Disable automatic triggers - pipeline runs only on manual trigger
trigger: none

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "**/*.tf"
      - "**/*.hcl"
      - "**/terragrunt.hcl"

# Параметри, избирани при пускане на пайплайна
parameters:
  - name: targetEnvironment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - dev
      - stage
      - prod

  - name: deploymentName
    displayName: "Deployment name"
    type: string
    default: "manual-001"

  - name: runDestroy
    displayName: "Run Destroy Stage"
    type: boolean
    default: false

variables:
  - name: terraformVersion
    value: "1.5.7"
  - name: terragruntVersion
    value: "0.55.1"
  - name: azureSubscription
    value: "azure-sirma-terraform"
  - name: TF_BACKEND_STORAGE_ACCOUNT
    value: "tfstatebc957e20" # Real storage account from bootstrap

stages:
  # ==================== BOOTSTRAP STAGE ====================
  - stage: bootstrap
    displayName: "Bootstrap Infrastructure"
    jobs:
      - job: bootstrap
        displayName: "Create Backend Storage"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - task: AzureCLI@2
            displayName: "Bootstrap Terraform Backend"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -e

                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                echo "==========================================="
                echo "Running Terraform Bootstrap"
                echo "==========================================="

                cd bootstrap

                # Get deployment name from pipeline parameter
                DEPLOYMENT_NAME="${{ parameters.deploymentName }}"
                echo "Deployment Name: $DEPLOYMENT_NAME"

                # Initialize Terraform (no backend needed for bootstrap)
                terraform init

                # Plan the changes with deployment_name variable
                echo "Planning bootstrap resources..."
                terraform plan -var="deployment_name=$DEPLOYMENT_NAME" -out=bootstrap.tfplan

                # Apply the changes
                echo "Applying bootstrap resources..."
                terraform apply -auto-approve bootstrap.tfplan

                # Get outputs
                echo "==========================================="
                echo "Bootstrap completed successfully!"
                echo "==========================================="

                STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)
                RESOURCE_GROUP=$(terraform output -raw resource_group_name)
                CONTAINER_NAME=$(terraform output -raw container_name)
                RG_CREATED=$(terraform output -raw resource_group_created)
                SA_CREATED=$(terraform output -raw storage_account_created)
                CONTAINER_CREATED=$(terraform output -raw container_created)

                echo "Resource Group: $RESOURCE_GROUP (Created: $RG_CREATED)"
                echo "Storage Account: $STORAGE_ACCOUNT (Created: $SA_CREATED)"
                echo "Container: $CONTAINER_NAME (Created: $CONTAINER_CREATED)"
                echo "==========================================="

                # Set the storage account name as a pipeline variable for subsequent stages
                echo "##vso[task.setvariable variable=TF_BACKEND_STORAGE_ACCOUNT;isOutput=true]$STORAGE_ACCOUNT"

  # ==================== PLAN STAGE ====================
  - stage: plan
    displayName: "Plan Terraform"
    dependsOn: bootstrap
    jobs:
      - job: plan
        displayName: "Plan Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              echo "Installing Terragrunt $(terragruntVersion)..."
              wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/
              terragrunt --version
            displayName: "Install Terragrunt"

          - task: AzureCLI@2
            displayName: "Terragrunt Plan"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_BACKEND_STORAGE_ACCOUNT=$(TF_BACKEND_STORAGE_ACCOUNT)

                ENV='${{ parameters.targetEnvironment }}'
                DEPLOY='${{ parameters.deploymentName }}'

                # Set container name based on deployment
                export TF_BACKEND_CONTAINER_NAME="tfstate-$DEPLOY"

                echo "Environment: $ENV"
                echo "Deployment: $DEPLOY"
                echo "Backend storage account: '$TF_BACKEND_STORAGE_ACCOUNT'"
                echo "Backend container: '$TF_BACKEND_CONTAINER_NAME'"

                if [ "$ENV" = "dev" ]; then
                  cd "live/1. dev"
                elif [ "$ENV" = "stage" ]; then
                  cd "live/2. stage"
                else
                  cd "live/3. prod"
                fi

                echo "==========================================="
                echo "Planning all modules in environment: $ENV"
                echo "==========================================="

                # List all modules that will be planned
                echo "Modules to be planned:"
                find . -maxdepth 1 -type d ! -name "." ! -name ".terraform" | sort

                # Create directory for plan files
                mkdir -p "$(Build.ArtifactStagingDirectory)/plans"

                # Run terragrunt run-all to handle all modules with dependencies
                echo "Running terragrunt run-all plan with output to artifact staging..."
                terragrunt run-all plan --terragrunt-non-interactive

                echo "==========================================="
                echo "Plan completed successfully for all modules"
                echo "==========================================="

          - task: PublishBuildArtifacts@1
            displayName: "Publish Plan Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/plans"
              ArtifactName: "tfplan"
              publishLocation: "Container"

  # ==================== APPLY STAGE ====================
  - stage: apply
    displayName: "Apply Terraform"
    dependsOn:
      - bootstrap
      - plan
    condition: succeeded()
    jobs:
      - job: apply
        displayName: "Apply Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - task: DownloadBuildArtifacts@0
            displayName: "Download Plan Artifact"
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "tfplan"
              downloadPath: "$(Pipeline.Workspace)"

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              echo "Installing Terragrunt $(terragruntVersion)..."
              wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/
              terragrunt --version
            displayName: "Install Terragrunt"

          - task: AzureCLI@2
            displayName: "Terragrunt Apply"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_BACKEND_STORAGE_ACCOUNT=$(TF_BACKEND_STORAGE_ACCOUNT)

                ENV='${{ parameters.targetEnvironment }}'
                DEPLOY='${{ parameters.deploymentName }}'
                KEY="$ENV/$DEPLOY.tfstate"

                # Set container name based on deployment
                export TF_BACKEND_CONTAINER_NAME="tfstate-$DEPLOY"

                echo "Environment: $ENV"
                echo "Deployment: $DEPLOY"
                echo "Backend storage account: '$TF_BACKEND_STORAGE_ACCOUNT'"
                echo "Backend container: '$TF_BACKEND_CONTAINER_NAME'"
                echo "Using backend key: $KEY"

                if [ "$ENV" = "dev" ]; then
                  cd "live/1. dev"
                elif [ "$ENV" = "stage" ]; then
                  cd "live/2. stage"
                else
                  cd "live/3. prod"
                fi

                echo "==========================================="
                echo "Applying all modules in environment: $ENV"
                echo "==========================================="

                # List all modules that will be applied
                echo "Modules to be applied:"
                find . -maxdepth 1 -type d ! -name "." ! -name ".terraform" | sort

                # # Check if plan files exist
                # if [ -d "$(Pipeline.Workspace)/tfplan" ]; then
                #   echo "Plan artifacts found, using saved plans..."

                #   # Run terragrunt run-all apply with the saved plan files
                #   echo "Running terragrunt run-all apply with saved plan..."
                #   terragrunt run-all apply --terragrunt-non-interactive -- "$(Pipeline.Workspace)/tfplan/tfplan"
                # else
                echo "No plan artifacts found, running apply without plan file..."
                terragrunt run-all apply --terragrunt-non-interactive --auto-approve
                # fi

                echo "==========================================="
                echo "Apply completed successfully for all modules"
                echo "==========================================="

  # ==================== DESTROY STAGE ====================
  # This stage only runs when manually triggered with runDestroy=true
  - stage: destroy
    displayName: "Destroy Terraform"
    dependsOn:
      - bootstrap
      - plan
      - apply
    condition: and(succeeded(), eq(variables['runDestroy'], 'true'))
    jobs:
      - job: destroy
        displayName: "Destroy Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              echo "Installing Terragrunt $(terragruntVersion)..."
              wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/
              terragrunt --version
            displayName: "Install Terragrunt"

          - task: AzureCLI@2
            displayName: "Terragrunt Destroy"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_BACKEND_STORAGE_ACCOUNT=$(TF_BACKEND_STORAGE_ACCOUNT)

                ENV='${{ parameters.targetEnvironment }}'
                DEPLOY='${{ parameters.deploymentName }}'
                KEY="$ENV/$DEPLOY.tfstate"

                # Set container name based on deployment
                export TF_BACKEND_CONTAINER_NAME="tfstate-$DEPLOY"

                echo "DESTROY environment: $ENV"
                echo "DESTROY deployment: $DEPLOY"
                echo "Backend storage account: '$TF_BACKEND_STORAGE_ACCOUNT'"
                echo "Backend container: '$TF_BACKEND_CONTAINER_NAME'"
                echo "Using backend key: $KEY"

                if [ "$ENV" = "dev" ]; then
                  cd "live/1. dev"
                elif [ "$ENV" = "stage" ]; then
                  cd "live/2. stage"
                else
                  cd "live/3. prod"
                fi

                echo "==========================================="
                echo "Destroying all modules in environment: $ENV"
                echo "==========================================="

                # List all modules that will be destroyed
                echo "Modules to be destroyed:"
                find . -maxdepth 1 -type d ! -name "." ! -name ".terraform" | sort

                # Run terragrunt run-all to handle all modules with dependencies (in reverse order)
                echo "Running terragrunt run-all destroy..."
                terragrunt run-all destroy --terragrunt-non-interactive --auto-approve

                echo "==========================================="
                echo "Destroy completed successfully for all modules"
                echo "==========================================="

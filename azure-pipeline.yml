# Disable automatic triggers - pipeline runs only on manual trigger
trigger: none

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - "**/*.tf"
      - "**/*.hcl"
      - "**/terragrunt.hcl"

# Параметри, избирани при пускане на пайплайна
parameters:
  - name: targetEnvironment
    displayName: "Environment"
    type: string
    default: "dev"
    values:
      - dev
      - stage
      - prod

  - name: deploymentName
    displayName: "Deployment name"
    type: string
    default: "manual-001"

variables:
  - name: terraformVersion
    value: "1.5.7"
  - name: terragruntVersion
    value: "0.55.1"
  - name: azureSubscription
    value: "azure-sirma-terraform"
  - name: TF_BACKEND_STORAGE_ACCOUNT
    value: "tfstate0182323" # смени тук с реалния tfstate storage account

stages:
  # ==================== BOOTSTRAP STAGE ====================
  - stage: bootstrap
    displayName: "Bootstrap Infrastructure"
    jobs:
      - job: bootstrap
        displayName: "Create Backend Storage"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - task: AzureCLI@2
            displayName: "Bootstrap Terraform Backend"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -e

                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                echo "==========================================="
                echo "Running Terraform Bootstrap"
                echo "==========================================="

                cd bootstrap

                # Initialize Terraform (no backend needed for bootstrap)
                terraform init

                # Plan the changes
                echo "Planning bootstrap resources..."
                terraform plan -out=bootstrap.tfplan

                # Apply the changes
                echo "Applying bootstrap resources..."
                terraform apply -auto-approve bootstrap.tfplan

                # Get outputs
                echo "==========================================="
                echo "Bootstrap completed successfully!"
                echo "==========================================="

                STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)
                RESOURCE_GROUP=$(terraform output -raw resource_group_name)
                CONTAINER_NAME=$(terraform output -raw container_name)
                RG_CREATED=$(terraform output -raw resource_group_created)
                SA_CREATED=$(terraform output -raw storage_account_created)
                CONTAINER_CREATED=$(terraform output -raw container_created)

                echo "Resource Group: $RESOURCE_GROUP (Created: $RG_CREATED)"
                echo "Storage Account: $STORAGE_ACCOUNT (Created: $SA_CREATED)"
                echo "Container: $CONTAINER_NAME (Created: $CONTAINER_CREATED)"
                echo "==========================================="

                # Set the storage account name as a pipeline variable for subsequent stages
                echo "##vso[task.setvariable variable=TF_BACKEND_STORAGE_ACCOUNT;isOutput=true]$STORAGE_ACCOUNT"

  # ==================== PLAN STAGE ====================
  - stage: plan
    displayName: "Plan Terraform"
    dependsOn: bootstrap
    jobs:
      - job: plan
        displayName: "Plan Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              echo "Installing Terragrunt $(terragruntVersion)..."
              wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/
              terragrunt --version
            displayName: "Install Terragrunt"

          - task: AzureCLI@2
            displayName: "Terragrunt Plan"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_BACKEND_STORAGE_ACCOUNT=$(TF_BACKEND_STORAGE_ACCOUNT)

                ENV='${{ parameters.targetEnvironment }}'
                DEPLOY='${{ parameters.deploymentName }}'

                echo "Environment: $ENV"
                echo "Deployment: $DEPLOY"
                echo "Backend storage account: '$TF_BACKEND_STORAGE_ACCOUNT'"

                if [ "$ENV" = "dev" ]; then
                  cd "live/1. dev"
                elif [ "$ENV" = "stage" ]; then
                  cd "live/2. stage"
                else
                  cd "live/3. prod"
                fi

                KEY="$ENV/$DEPLOY.tfstate"
                echo "Using backend key: $KEY"

                terragrunt init -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" -backend-config="key=$KEY"
                terragrunt plan -out="$(Build.ArtifactStagingDirectory)/$ENV-$DEPLOY-tfplan"

                echo "Plan completed successfully"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Plan Artifact"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "tfplan"
              publishLocation: "Container"

  # ==================== APPLY STAGE ====================
  - stage: apply
    displayName: "Apply Terraform"
    dependsOn:
      - bootstrap
      - plan
    condition: succeeded()
    jobs:
      - job: apply
        displayName: "Apply Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - task: DownloadBuildArtifacts@0
            displayName: "Download Plan Artifact"
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "tfplan"
              downloadPath: "$(Pipeline.Workspace)"

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              echo "Installing Terragrunt $(terragruntVersion)..."
              wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/
              terragrunt --version
            displayName: "Install Terragrunt"

          - task: AzureCLI@2
            displayName: "Terragrunt Apply"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_BACKEND_STORAGE_ACCOUNT=$(TF_BACKEND_STORAGE_ACCOUNT)

                ENV='${{ parameters.targetEnvironment }}'
                DEPLOY='${{ parameters.deploymentName }}'
                KEY="$ENV/$DEPLOY.tfstate"

                echo "Environment: $ENV"
                echo "Deployment: $DEPLOY"
                echo "Backend storage account: '$TF_BACKEND_STORAGE_ACCOUNT'"
                echo "Using backend key: $KEY"

                if [ "$ENV" = "dev" ]; then
                  cd "live/1. dev"
                elif [ "$ENV" = "stage" ]; then
                  cd "live/2. stage"
                else
                  cd "live/3. prod"
                fi

                terragrunt init -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" -backend-config="key=$KEY"
                terragrunt apply "$(Pipeline.Workspace)/tfplan/$ENV-$DEPLOY-tfplan"

                echo "Apply completed successfully"

  # ==================== DESTROY STAGE ====================
  - stage: destroy
    displayName: "Destroy Terraform"
    dependsOn:
      - bootstrap
    condition: always()
    jobs:
      - job: destroy
        displayName: "Destroy Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: "Install Terraform"

          - script: |
              echo "Installing Terragrunt $(terragruntVersion)..."
              wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64
              chmod +x terragrunt
              sudo mv terragrunt /usr/local/bin/
              terragrunt --version
            displayName: "Install Terragrunt"

          - task: AzureCLI@2
            displayName: "Terragrunt Destroy"
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_BACKEND_STORAGE_ACCOUNT=$(TF_BACKEND_STORAGE_ACCOUNT)

                ENV='${{ parameters.targetEnvironment }}'
                DEPLOY='${{ parameters.deploymentName }}'
                KEY="$ENV/$DEPLOY.tfstate"

                echo "DESTROY environment: $ENV"
                echo "DESTROY deployment: $DEPLOY"
                echo "Backend storage account: '$TF_BACKEND_STORAGE_ACCOUNT'"
                echo "Using backend key: $KEY"

                if [ "$ENV" = "dev" ]; then
                  cd "live/1. dev"
                elif [ "$ENV" = "stage" ]; then
                  cd "live/2. stage"
                else
                  cd "live/3. prod"
                fi

                terragrunt init -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT" -backend-config="key=$KEY"
                terragrunt destroy -auto-approve

                echo "Destroy completed successfully"
